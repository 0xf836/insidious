name: Reusable validation
on:
  workflow_call:
    outputs:
      matrix:
        description: Validated candidate build matrix
        value: ${{ jobs.validation.outputs.matrix }}
      docs_only:
        description: Whether only documentation changed
        value: ${{ jobs.validation.outputs.docs_only }}
      packages_required:
        description: Whether native package qualification replaces build-only checks
        value: ${{ jobs.validation.outputs.packages_required }}
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      packages_required: ${{ steps.policy.outputs.packages_required }}
      docs_only: ${{ steps.policy.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'ci_policy_tests.py' -v
      - run: python3 -m unittest discover -s tests -p 'packaging_tests.py' -v
      - run: python3 -m unittest discover -s tests -p 'release_tests.py' -v
      - id: policy
        run: python3 tools/ci/checks.py validate
      - name: Check locked Rust bridge
        if: steps.policy.outputs.docs_only != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-results/cargo-checks
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.89.0 cargo fetch --locked --manifest-path rust/jxl_bridge/Cargo.toml
          rustup run 1.89.0 cargo fmt --manifest-path rust/jxl_bridge/Cargo.toml -- --check
          rustup run 1.89.0 cargo clippy --frozen --manifest-path rust/jxl_bridge/Cargo.toml -- -D warnings
